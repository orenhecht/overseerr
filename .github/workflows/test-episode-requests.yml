name: Temp Episode Requests Testing & Build

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    paths:
      - 'src/components/RequestModal/**'
      - 'src/components/TvDetails/**'
      - 'server/entity/EpisodeRequest.ts'
      - 'server/subscriber/MediaRequestSubscriber.ts'
      - 'server/api/servarr/sonarr.ts'
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Build and publish Docker image'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_tests:
        description: 'Run episode request tests'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      image_tag:
        description: 'Custom image tag (optional)'
        required: false
        default: 'manual-test'
        type: string

jobs:
  test-episode-functionality:
    name: Test Episode Request Features
    runs-on: ubuntu-latest
    if: github.event.inputs.run_tests != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.18.2'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run TypeScript checks
        run: yarn typecheck

      - name: Run linting
        run: yarn lint

      - name: Run formatting check
        run: yarn format:check

      - name: Build application
        run: yarn build

      - name: Run episode request tests
        uses: cypress-io/github-action@v4
        with:
          build: yarn cypress:build
          start: yarn start
          wait-on: 'http://localhost:5055'
          spec: 'cypress/e2e/**/*.cy.ts'
          record: false
        env:
          WITH_MIGRATIONS: true

  build-test-image:
    name: Build Test Docker Image
    runs-on: ubuntu-latest
    needs: test-episode-functionality
    if: |
      always() &&
      (needs.test-episode-functionality.result == 'success' || needs.test-episode-functionality.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_image != 'false')
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/overseerr-episode-requests
          tags: |
            type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}

      - name: Build and push test image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_TAG=${{ github.sha }}
